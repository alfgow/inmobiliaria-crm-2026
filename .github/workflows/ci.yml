name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      DATABASE_URL: "postgresql://user:password@localhost:5432/inmobiliaria?schema=public"
      AUTH_SECRET: "ci-auth-secret"
      MAPBOX_TOKEN: "ci-mapbox-token"
      NEXT_PUBLIC_MAPBOX_TOKEN: "ci-mapbox-token"
      NEXT_MAPBOX_STYLE: "ci-mapbox-style"
      AWS_ACCESS_KEY_ID: "ci-access-key"
      AWS_SECRET_ACCESS_KEY: "ci-secret-key"
      AWS_DEFAULT_REGION: "mx-central-1"
      AWS_BUCKET: "ci-bucket"
      AWS_USE_PATH_STYLE_ENDPOINT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: inmobiliaria-crm-2026:ci
